services:
  mongodb:
    image: mongo:8.0
    container_name: packhub_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PACKHUB_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PACKHUB_DB_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${PACKHUB_DB_USER}",
          "--password",
          "${PACKHUB_DB_PASSWORD}",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    image: mominul/packhub
    container_name: packhub_app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.env:/app/.env:ro
      - ./key.gpg:/app/key.gpg:ro
      - ${PACKHUB_DOCKER_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${PACKHUB_DOCKER_ACME_WEBROOT:-/var/www/packhub-acme}:/var/www/acme:ro

volumes:
  mongodb_data:
